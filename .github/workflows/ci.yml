name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # ghcr.io requires lowercase image names.
  IMAGE: ghcr.io/alexcristian/nexusplay

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check generated templates are up to date
        run: |
          go run github.com/a-h/templ/cmd/templ@v0.3.1070 generate
          git diff --exit-code -- '*_templ.go'
      - name: Vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
      - name: House style
        run: go run ./tools/housestyle/cmd/housestyle ./...
      - name: Test
        run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Cache pinned Chrome
        uses: actions/cache@v6
        with:
          path: .cache/chrome
          key: chrome-${{ hashFiles('scripts/install-chrome.sh') }}
      - name: Install pinned Chrome
        run: ./scripts/install-chrome.sh
      - name: Integration and screenshot tests
        env:
          NEXUSPLAY_REQUIRE_INTEGRATION: "1"
          NEXUSPLAY_SCREENSHOT_FAILURES: ${{ github.workspace }}/screenshot-failures
        run: go test -tags integration -count=1 ./integration/
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-failures
          path: screenshot-failures/
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: [test, integration]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: nexusplay:ci
          cache-from: type=gha
      - name: Smoke test
        run: |
          mkdir -p media
          docker run -d --name np -p 8080:8080 -v "$PWD/media:/media:ro" nexusplay:ci
          for _ in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q "Nexus Play"
          docker logs np

  # Publishes the multi-platform image to ghcr.io after every check passes.
  # Pull requests never publish.
  publish:
    runs-on: ubuntu-latest
    needs: [test, integration, docker]
    if: >-
      github.event_name == 'push' && (
        github.ref == 'refs/heads/go-rewrite' ||
        github.ref == 'refs/heads/master' ||
        startsWith(github.ref, 'refs/tags/v')
      )
    permissions:
      contents: read
      packages: write
    # A newer push to the same branch or tag replaces an older publish, so a
    # slow run can never overwrite the tag with an older image.
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # "latest" comes only from the default-branch rule below, never from a version tag.
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=https://github.com/AlexCristian/NexusPlay
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
